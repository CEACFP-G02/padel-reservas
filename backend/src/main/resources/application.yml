spring:
  application:
    name: padel-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/padel}
    username: ${DB_USER:padel}
    password: ${DB_PASSWORD:padel}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  booking:
    cancel-min-notice-hours: 24
  availability:
    nearby-days-window: 7
  jwt:
    # Base64-encoded HMAC key (>= 256 bits). Override with JWT_SECRET outside local dev.
    secret: ${JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LWNoYW5nZS1tZS1kZXYtb25seS1zZWNyZXQtY2hhbmdlLW1l}
    access-token-ttl-minutes: 15
    refresh-token-ttl-days: 7
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
